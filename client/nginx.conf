# Client-side routing (react-router's BrowserRouter -- /, /checkout) means a direct request
# for /checkout has to be served index.html and let the app's router take it from there,
# not 404 from nginx just because no file called "checkout" exists on disk.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's default build output) are safe to cache aggressively; the
    # HTML entry point is deliberately left out of this block so a new deploy is picked up
    # on the next load instead of being served from a stale cached index.html.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
